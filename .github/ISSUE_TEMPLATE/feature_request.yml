name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve BabyExpr? Describe it below.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or annoying right now?
      placeholder: e.g. "There's no way to use the modulo (%) operator"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Any other approaches you thought about
    validations:
      required: false