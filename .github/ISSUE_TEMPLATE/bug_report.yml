name: 🐛 Bug Report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: e.g. "Dividing by zero crashes with a raw Python traceback instead of a clean error"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What input/command caused this?
      placeholder: |
        1. Run `python main.py`
        2. Enter `5 / 0`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.11
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Error messages, screenshots, or anything else that helps
    validations:
      required: false